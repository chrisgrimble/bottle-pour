<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bottle Pour</title>
  <style>
    * { box-sizing: border-box; }
    :root { color-scheme: dark; background: #141826; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at top, #2b3550, #141826);
      color: #eef;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-block: 24px;
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px));
      overflow-x: hidden;  /* a tilted bottle may poke past the edge mid-pour */
    }
    h1 { margin: 0 0 8px; font-weight: 600; letter-spacing: 1px; }
    #status {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px 24px;
      margin-bottom: 16px;
      opacity: 0.85;
    }
    #controls { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-bottom: 40px; }
    button {
      font: inherit;
      padding: 8px 16px;
      border: none;
      border-radius: 8px;
      background: #4a5a85;
      color: #fff;
      cursor: pointer;
    }
    button:hover { background: #5b6da0; }
    button:disabled { opacity: 0.4; cursor: default; }

    #board {
      display: flex;
      flex-wrap: wrap;
      gap: 28px;
      justify-content: center;
      max-width: 1000px;
      position: relative;
    }
    /* Phones: smaller bottles so the bigger levels fit in a couple of rows. */
    @media (max-width: 520px) {
      h1 { font-size: 1.6em; }
      #controls { margin-bottom: 28px; }
      #board { gap: 18px 12px; }
      .bottle { --layer-h: 28px; width: 42px; border-radius: 0 0 18px 18px; }
    }
    .bottle.pouring {
      z-index: 10;
      transform-origin: top center;
    }
    .stream {
      position: absolute;
      width: 10px;
      border-radius: 5px;
      z-index: 5;
    }
    .bottle {
      --layer-h: 40px;
      width: 60px;
      /* height is set from capacity in game.js */
      border: 3px solid rgba(255, 255, 255, 0.75);
      border-top: none;
      border-radius: 0 0 26px 26px;
      background: rgba(255, 255, 255, 0.06);
      display: flex;
      flex-direction: column-reverse;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      position: relative;
    }
    .bottle::before {
      /* bottle neck rim */
      content: "";
      position: absolute;
      top: 0; left: -3px; right: -3px;
      height: 3px;
      background: rgba(255, 255, 255, 0.75);
    }
    .bottle.selected {
      transform: translateY(-20px);
      box-shadow: 0 0 18px rgba(255, 255, 200, 0.7);
    }
    .bottle.shake { animation: shake 0.35s; }
    @keyframes shake {
      0%, 100% { translate: 0; }
      20% { translate: -6px; }
      40% { translate: 6px; }
      60% { translate: -4px; }
      80% { translate: 4px; }
    }
    .layer {
      height: var(--layer-h);
      flex-shrink: 0;
      border-top: 1px solid rgba(0, 0, 0, 0.15);
    }

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .overlay[hidden] { display: none; }
    .overlay .panel {
      background: #2b3550;
      padding: 32px 40px;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
    }
    .overlay h2 { margin-top: 0; font-size: 2em; }
    .overlay .panel { max-width: 100%; max-height: 100%; overflow-y: auto; }
    .panel-buttons { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    button.secondary { background: transparent; box-shadow: inset 0 0 0 2px #4a5a85; }
    button.secondary:hover { background: rgba(74, 90, 133, 0.35); }
    button:focus-visible { outline: 2px solid #f1c40f; outline-offset: 2px; }

    #win-stars { font-size: 3em; line-height: 1; letter-spacing: 6px; }
    .star { display: inline-block; color: #4a5a85; }
    .star.earned { color: #f1c40f; animation: star-pop 0.4s backwards; }
    @keyframes star-pop {
      from { transform: scale(0) rotate(-30deg); opacity: 0; }
      70% { transform: scale(1.3); }
      to { transform: scale(1); opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .star.earned { animation: none; }
    }

    #star-total { margin-top: -8px; color: #f1c40f; font-variant-numeric: tabular-nums; }
    #level-grid {
      display: grid;
      grid-template-columns: repeat(5, 72px);
      gap: 10px;
      margin-bottom: 20px;
      justify-content: center;
    }
    .level-tile {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 10px 4px;
      background: #3a4870;
    }
    .level-tile.current { box-shadow: inset 0 0 0 2px #f1c40f; }
    .level-tile:disabled { background: #222a40; opacity: 1; color: #6b7699; }
    .tile-number { font-size: 1.3em; font-weight: 600; font-variant-numeric: tabular-nums; }
    .tile-stars { font-size: 0.8em; color: #f1c40f; letter-spacing: 1px; }
    .level-tile:disabled .tile-stars { color: inherit; }
    @media (max-width: 520px) {
      .overlay .panel { padding: 24px 16px; }
      #level-grid { grid-template-columns: repeat(4, 60px); gap: 8px; }
    }
    #name-form { display: flex; flex-direction: column; gap: 12px; align-items: center; }
    #name-input {
      font: inherit;
      padding: 8px 12px;
      border-radius: 8px;
      border: 2px solid #4a5a85;
      background: #141826;
      color: #fff;
      width: 220px;
      text-align: center;
    }
    #name-input:focus { outline: none; border-color: #8fa3e0; }
  </style>
</head>
<body>
  <h1>Bottle Pour</h1>
  <div id="status">
    <span>Player: <strong id="player"></strong></span>
    <span>Level: <strong id="level"></strong></span>
    <span>Moves: <strong id="moves"></strong></span>
  </div>
  <div id="controls">
    <button id="undo">Undo</button>
    <button id="restart">Restart</button>
    <button id="levels">Levels</button>
    <button id="change-player">Change player</button>
  </div>
  <div id="board"></div>

  <div id="win" class="overlay" hidden>
    <div class="panel">
      <h2>You win!</h2>
      <div id="win-stars" role="img"></div>
      <p id="win-text"></p>
      <div class="panel-buttons">
        <button id="win-levels" class="secondary">Levels</button>
        <button id="next">Next level</button>
      </div>
    </div>
  </div>

  <div id="levels-dialog" class="overlay" hidden>
    <div class="panel">
      <h2>Levels</h2>
      <p id="star-total"></p>
      <div id="level-grid"></div>
      <button id="close-levels" class="secondary">Back to game</button>
    </div>
  </div>

  <div id="name-dialog" class="overlay" hidden>
    <div class="panel">
      <h2>Who's playing?</h2>
      <form id="name-form">
        <input id="name-input" type="text" maxlength="30" placeholder="Your name"
               autocomplete="off" required>
        <button type="submit">Play</button>
      </form>
    </div>
  </div>

  <script src="rules.js"></script>
  <script src="progress.js"></script>
  <script src="levels.js"></script>
  <script src="game.js"></script>
</body>
</html>
